<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voter Search Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Loader -->
  <div id="loading" class="active">
    <div class="spinner"></div>
    <div class="loading-text">Loading voter data...</div>
  </div>

  <!-- Header -->
  <header>
    <h1>🗳️ Voter Search Portal</h1>
    <p class="subtitle">Find voters by name, house, or ID</p>
  </header>

  <!-- Main Section -->
  <main>
    <div class="controls">
      <div class="dropdowns">
        <select id="language">
          <option value="english">English</option>
          <option value="malayalam">മലയാളം</option>
        </select>

        <select id="ward">
          <option value="all">All Wards</option>
        </select>
      </div>

      <div class="search-box">
        <input type="text" id="search" placeholder="Search by name, house, or ID...">
        <button id="searchBtn">🔍 Search</button>
      </div>
    </div>

    <div id="error" class="error"></div>

    <div class="table-container fade">
      <table>
        <thead>
          <tr>
            <th>Serial</th>
            <th>Ward</th>
            <th>PS No</th>
            <th>Name</th>
            <th>Guardian</th>
            <th>House No</th>
            <th>House Name</th>
            <th>Gender</th>
            <th>Age</th>
            <th>ID</th>
            <th>Polling Station</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>© 2025 Voter Lookup | Designed for Speed & Simplicity</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
