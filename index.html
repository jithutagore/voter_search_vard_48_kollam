<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Search - Kollam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
     <!-- Version 1.0.0 -->
    <div id="loader" class="loader">
    <div class="loader-ring">
        <div class="spinner"></div>
    </div>
    </div>


    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Voter Search System</h1>
            <p class="subtitle">Kollam - PORT & KAIKULANGARA Wards</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-controls">
                <!-- Search Input -->
                <div class="input-group">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search by name, house, guardian, or voter ID..."
                        class="search-input"
                    >
                </div>

                <!-- Ward Filter -->
                <div class="filter-group">
                    <label for="wardFilter">Ward:</label>
                    <select id="wardFilter" class="filter-select">
                        <option value="all">All Wards</option>
                        <option value="048">048 - PORT</option>
                        <option value="049">049 - KAIKULANGARA</option>
                    </select>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="button-group">
                <button id="searchBtn" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    Search Voters
                </button>
            </div>
        </div>

        <!-- Results Count -->
        <div id="resultsCount" class="results-count"></div>

        <!-- Results Section -->
        <div id="results" class="results-container"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 Voter Search System - Kollam</p>
    </footer>

    <!-- Load sql.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="script.js"></script>
    
</body>
</html>
